<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>종겜스 시뮬레이터</title>
<meta name="description" content="종합게임 스트리머가 되어 AI 시청자를 만족시키는 시뮬레이터">
<link rel="icon" href="games/shell/img/ui-logo.png">
<link rel="stylesheet" href="games/shell/shell.css">
</head>
<body>

<!-- 바탕화면 — 페이지 자체가 스트리머의 윈도우 데스크탑이다.
     허브(방송 준비)에서는 JGS 창이 최소화되고 여기 아이콘이 보인다 -->
<div id="desktop"></div>

<!-- 첫 방문 스플래시 — "링크를 열자마자 맨 데스크탑"이라는 불친절함의 해소.
     목표(시청자 = 점수 = 생명)와 조작(더블클릭)을 한 화면으로 말하고 사라진다 -->
<div id="introSplash" class="hidden">
  <div class="isPanel">
    <b class="isLogo">JGS<span>.tv</span></b>
    <h1>당신은 종합게임 스트리머다</h1>
    <!-- 4컷 인트로 — 컷은 AetherAI 생성, 캡션은 HTML (이미지 무텍스트 원칙) -->
    <div class="comic">
      <figure><img src="games/shell/img/comic-1.jpg" alt=""><figcaption><b>1</b> 시청자 0명. 아무도 나를 보지 않았다.</figcaption></figure>
      <figure><img src="games/shell/img/comic-2.jpg" alt=""><figcaption><b>2</b> 그때 김 피디가 계약서를 내밀었다 — "JGS.tv 파트너, 해볼래요?"</figcaption></figure>
      <figure><img src="games/shell/img/comic-3.jpg" alt=""><figcaption><b>3</b> 잘한 방송보다 <b>터진 방송</b>이 남는다 — 사고도 콘텐츠다.</figcaption></figure>
      <figure><img src="games/shell/img/comic-4.jpg" alt=""><figcaption><b>4</b> 목표는 <b class="dia">다이아 파트너</b>. 다만 <b>시청자가 0명이 되면 방송도 끝</b>난다.</figcaption></figure>
    </div>
    <p class="isSub">같은 게임만 파면 시청자가 물린다(신선도) — 방송을 바꿔가며 도는 게 종겜이다.</p>
    <button id="introGo" type="button" class="slab primary">파트너 계약 — 방송국 입장 →</button>
  </div>
</div>

<!-- JGS.tv 플랫폼 = 데스크탑 위에 떠 있는 '창'. 방송 중에만 열려 있다 -->
<div id="jgsWin" class="minimized">
<div id="winbar">
  <span class="winIco"><img class="uiIco" src="games/shell/img/ui-logo.png" alt=""></span>
  <span class="winTitle">JGS.tv — 스트리머 스튜디오</span>
  <span class="winBtns"><i>─</i><i>□</i><i class="x">×</i></span>
</div>
<!-- 플랫폼 크롬 — "방송 플랫폼 안에 있다"는 감각은 여기서 시작된다 -->
<div id="topbar">
  <div class="tbL">
    <span class="tbLogo">JGS<span>.tv</span></span>
    <span class="tbStudio">스트리머 스튜디오</span>
  </div>
  <div class="tbR">
    <span id="tbLive" class="off">OFFLINE</span>
    <span class="tbStat">구독자 <b id="tbSubs">0</b></span>
    <span class="tbStat">방송 <b id="tbShows">0</b>회</span>
    <span class="tbStat"><img class="uiIco" src="games/shell/img/ui-coin.png" alt=""> <b id="tbCoins">0</b></span>
    <span class="tbStat" id="tbTier"></span>
  </div>
</div>

<div id="stagewrap">
  <div id="showRow">
  <div id="viewport">
    <canvas id="scene" width="960" height="430"></canvas>
    <div id="tally"><span>● ON AIR <b id="tallyUp"></b></span><span id="tallyR">—</span></div>
    <div id="liveBar"><img class="uiIco" src="games/shell/img/ui-eye.png" alt="시청자"> <b id="viewerCount">0</b>명</div>
    <div id="paceChip" class="hidden"></div>
    <div id="donBanner"></div>
    <canvas id="liveGraph" width="960" height="34"></canvas>
    <div id="plaque"></div>
    <div id="chainMeter"><div class="lab">연쇄 배수</div><div class="val" id="chainVal">×1.0</div></div>
    <div id="replayWin"></div>
    <div class="vpopup" id="vpopup"></div>
    <div id="camBox" class="hidden"><img id="camImg" src="games/shell/faces/adventurer_silence.png" alt="스트리머 캠"><span>LIVE CAM</span></div>
    <div id="ticker"></div>
    <div id="bigStamp"><div id="bigStampText"></div></div>
    <div id="overlay" class="hidden"></div>
  </div>
  </div>
  <!-- 플랫폼식 방송 정보줄 — 실제 스트리밍 페이지의 제목·카테고리·시청자 행 -->
  <div id="infoRow">
    <span id="infoDot" class="off">●</span>
    <div class="infoMain">
      <b id="infoTitle">방송 준비 중…</b>
      <div class="infoSub">
        <span class="cat" id="infoCat">대기 화면</span>
        <span id="infoUptime"></span>
      </div>
    </div>
    <div class="infoR">
      <span class="infoViewers"><img class="uiIco" src="games/shell/img/ui-eye.png" alt="시청자"> <b id="infoViewers">0</b></span>
      <button id="followBtn" type="button"><img class="uiIco" src="games/shell/img/ui-heart.png" alt=""> 팔로우</button>
    </div>
  </div>
  <div id="panel"></div>
  <div id="foot"></div>
</div>

</div><!-- /jgsWin -->

<!-- 채팅 팝아웃 창 — 실제 스트리머처럼 채팅을 항상 우측에 띄워 둔다.
     데스크탑(방송 전)에도, 전체화면 방송 중에도 이 창만은 계속 보인다 -->
<div id="chatDock">
  <div id="chatWinbar"><span class="winIco"><img class="uiIco" src="games/shell/img/ui-chat.png" alt=""></span><span class="winTitle">실시간 채팅</span>
    <span class="chatBadge" id="chatBadge">AI 시청자 — 로컬 시뮬레이션</span></div>
  <div id="chatCol"><div id="chatFeed"></div></div>
</div>

<!-- 윈도우 작업표시줄 — 페이지 하단 고정. 시작 버튼(프로필) · 실행 앱 · 트레이 -->
<div id="taskbar">
  <button id="tbStart" type="button">
    <img src="games/shell/faces/adventurer_silence.png" alt=""><b>종겜러</b>
  </button>
  <div id="tbApps">
    <span class="tbApp" id="appJgs"><i><img class="uiIco" src="games/shell/img/ui-logo.png" alt=""></i>JGS.tv 스튜디오</span>
    <span class="tbApp dim"><i><img class="uiIco" src="games/shell/img/ui-obs.png" alt=""></i>송출 프로그램<em id="obsDot">●</em></span>
  </div>
  <span class="dTray"><i id="dRec">● REC</i><i><img class="uiIco" src="games/shell/img/ui-sound.png" alt="소리"></i><i><img class="uiIco" src="games/shell/img/ui-net.png" alt="네트워크"></i><i id="dClock"></i></span>
</div>

<!-- 관객(engine/) — 페르소나 캐스트(data/, 소윤)를 먼저, 그걸 읽는 채팅 엔진·LLM 어댑터 순 -->
<script src="data/personas/cast.js"></script>
<script src="games/shell/config.js"></script>
<script src="engine/chat.js"></script>
<script src="engine/llm.js"></script>
<!-- 셸(무대) — 시청자 경제·게임 단위 신선도·방송 루프 -->
<script src="games/shell/shell.js"></script>
<!-- 게임 — 각자 자기 이벤트 어휘(chat-data)와 룰(game)을 가지고 셸에 등록한다 -->
<script src="games/hwaryeok/chat-data.js"></script>
<script src="games/hwaryeok/game.js"></script>
<script src="games/giving-up/chat-data.js"></script>
<script src="games/giving-up/game.js"></script>
<script src="games/pocket/chat-data.js"></script>
<script src="games/pocket/game.js"></script>
<script src="games/bomb/chat-data.js"></script>
<script src="games/bomb/game.js"></script>
<script src="games/fishing/chat-data.js"></script>
<script src="games/fishing/game.js"></script>
<script>Shell.boot();</script>

</body>
</html>
