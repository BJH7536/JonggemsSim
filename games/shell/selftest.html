<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>셸 자체 점검</title>
<style>
  body { background:#0b0908; color:#ece7dd; font:13px/1.7 ui-monospace, Consolas, monospace; padding:24px; }
  .ok { color:#6fd98f; } .ng { color:#ff6b5a; font-weight:700; }
  h1 { font-size:16px; color:#ffb447; letter-spacing:2px; }
  p.note { color:#8a8478; }
</style>
</head>
<body>
<h1>JONGGEMS SHELL — SELF CHECK</h1>
<p class="note">조용히 틀리면 게임이 뒤집히는 로직만 본다: 규약 4 신선도 회전과 채팅 검증 게이트.<br>
그래픽·물리는 대상이 아니다 (눈으로 본다).</p>
<pre id="out"></pre>

<script src="config.js"></script>
<script src="chat.js"></script>
<script src="llm.js"></script>
<script src="shell.js"></script>
<script src="../hwaryeok/chat-data.js"></script>
<script src="../hwaryeok/game.js"></script>
<script src="../giving-up/chat-data.js"></script>
<script src="../giving-up/game.js"></script>
<script src="../pocket/chat-data.js"></script>
<script src="../pocket/game.js"></script>
<script>
var pass = 0, fail = 0, log = [];
function eq(label, got, want) {
  var g = JSON.stringify(got), w = JSON.stringify(want);
  var ok = g === w;
  ok ? pass++ : fail++;
  log.push((ok ? '  ok  ' : ' FAIL ') + label + (ok ? '' : '\n        got  ' + g + '\n        want ' + w));
}
function ok(label, cond) { eq(label, !!cond, true); }

// ---- 규약 4: 신선도 감쇠표 ----
eq('감쇠표는 100/70/45/25/10%', Shell.FRESH_MULT, [1, .7, .45, .25, .1]);

// ---- 규약 4: 같은 게임만 반복하면 바닥까지 물린다 ----
var ids = ['a', 'b'], f = {};
var seq = [];
for (var i = 0; i < 6; i++) { f = Shell.rotateFresh(f, 'a', ids); seq.push(f.a); }
eq('a만 6회 방송 → 단계 1,2,3,4,4,4', seq, [1, 2, 3, 4, 4, 4]);
eq('그동안 b는 0에서 더 내려가지 않는다', f.b, 0);

// ---- 규약 4: 종겜을 벌주면 안 된다 ----
// 중요한 건 저장된 단계가 아니라 "방송을 시작하는 순간 적용되는 배수"다.
// 교대로 틀면 매 방송이 ×1.0이어야 하고, 한 게임만 파면 계단식으로 떨어져야 한다.
function multsWhilePlaying(order) {
  var m = {}, got = [];
  order.forEach(function (id) {
    got.push(Shell.FRESH_MULT[m[id] || 0]);
    m = Shell.rotateFresh(m, id, ids);
  });
  return got;
}
eq('a,b 교대 8회 → 매 방송이 100%', multsWhilePlaying(['a','b','a','b','a','b','a','b']),
   [1, 1, 1, 1, 1, 1, 1, 1]);
eq('a만 6회 → 100/70/45/25/10/10%', multsWhilePlaying(['a','a','a','a','a','a']),
   [1, .7, .45, .25, .1, .1]);

// ---- 규약 4: 물린 뒤 다른 게임을 방송하면 회복된다 ----
f = {};
for (var k = 0; k < 3; k++) f = Shell.rotateFresh(f, 'a', ids); // a: 3단계
eq('a 3회 → 3단계', f.a, 3);
f = Shell.rotateFresh(f, 'b', ids);
eq('b 한 판이 a를 한 단계 회복시킨다', f.a, 2);

// ---- 채팅 검증 게이트 ----
Chat.init(document.createElement('div'));
Chat.load({
  t: { facts: ['수습 +{gain}!!'], flavor: [['hype', '와 미쳤다'], ['mock', '운빨 ㅋㅋ']] },
}, {});
Chat.history.length = 0;
ok('사실 슬롯이 빠진 발화는 폐기된다', Chat.verify('아무 말', { gain: '1,234' }) === false);
ok('슬롯이 그대로 들어간 발화는 통과한다', Chat.verify('수습 +1,234!!', { gain: '1,234' }) === true);
Chat.history = ['와 미쳤다'];
ok('직전 발화와 같으면 폐기된다 (비반복 게이트)', Chat.verify('와 미쳤다', {}) === false);
ok('다른 말은 통과한다', Chat.verify('운빨 ㅋㅋ', {}) === true);
Chat.history.length = 0;
ok('어휘에 없는 이벤트는 조용히 무시된다 (셸이 죽지 않는다)',
   (function () { try { Chat.react('없는이벤트'); return true; } catch (e) { return false; } })());

// ---- 사실 슬롯 이스케이프가 검증 계약을 깨지 않는지 ----
Chat.history.length = 0;
var composed = Chat.compose({ nick: 'x', color: '#fff', tones: ['hype'] }, 't', { gain: '9,999' }, true);
eq('슬롯 치환 결과', composed, '수습 +9,999!!');

// ---- 등록된 게임이 계약을 지키는가 ----
eq('게임 3종이 등록된다', Shell.games.map(function (g) { return g.id; }), ['hwaryeok', 'giving-up', 'pocket']);
Shell.games.forEach(function (g) {
  ok(g.title + ': 필수 필드가 있다',
     g.title && g.tagline && g.duration > 0 && g.startViewers > 0 && typeof g.start === 'function');
  ok(g.title + ': 채팅 어휘에 start/end가 있다', !!(g.chat.T.start && g.chat.T.end));
  var thin = Object.keys(g.chat.T).filter(function (k) { return g.chat.T[k].flavor.length < 6; });
  eq(g.title + ': 모든 이벤트가 flavor 6개 이상 (비반복 게이트 전제)', thin, []);
  var tones = ['hype', 'worry', 'info', 'mock', 'cheer', 'question'];
  var bad = [];
  Object.keys(g.chat.T).forEach(function (k) {
    g.chat.T[k].flavor.forEach(function (f) { if (tones.indexOf(f[0]) < 0) bad.push(k + ':' + f[0]); });
  });
  eq(g.title + ': 톤이 전부 공인 6종 안에 있다', bad, []);
  // 사실 템플릿 슬롯 정합 — 한 이벤트의 사실 템플릿들은 같은 슬롯 집합을 써야 한다.
  // 다르면 게임이 어떤 facts를 넘겨도 일부 템플릿이 "모든 슬롯 포함" 게이트에서 반드시
  // 떨어져 사실 줄이 확률적으로(최악엔 상시) 폐기된다 — pocket 4종에서 실제 발생 (관객 리뷰)
  var slotBad = [];
  Object.keys(g.chat.T).forEach(function (k) {
    var fs = g.chat.T[k].facts || [];
    if (fs.length < 2) return;
    var sets = fs.map(function (t) {
      return (t.match(/\{(\w+)\}/g) || []).map(function (s) { return s.slice(1, -1); })
        .sort().filter(function (v, i, a) { return a.indexOf(v) === i; }).join(',');
    });
    for (var si = 1; si < sets.length; si++) {
      if (sets[si] !== sets[0]) { slotBad.push(k + '(' + sets.join(' vs ') + ')'); break; }
    }
  });
  eq(g.title + ': 사실 템플릿들이 같은 슬롯 집합을 쓴다', slotBad, []);
});

// ---- 공명 판정층 (ADR-002) ----
// 배분이 조용히 틀리면 "관객 구성"이라는 코어가 통째로 거짓말이 된다 — 총량 보존과
// 공명 방향(어떤 자극이 어떤 원형을 부르는가) 두 가지를 계산으로 못박는다.
eq('경제 원형 4종', Shell.ARCH.map(function (a) { return a.id; }), ['thrill', 'fan', 'expert', 'casual']);
ok('시작 구성비 합이 1', Math.abs(Shell.ARCH_START.reduce(function (a, b) { return a + b; }, 0) - 1) < 1e-9);
var ARCH_IDS = Shell.ARCH.map(function (a) { return a.id; });
eq('페르소나 8종이 전부 유효한 원형에 매핑된다',
   Chat.personas.filter(function (p) { return ARCH_IDS.indexOf(p.arch) < 0; })
     .map(function (p) { return p.nick; }), []);

Shell.games.forEach(function (g) {
  var S = (g.chat && g.chat.STIM) || {};
  var badVec = Object.keys(S).filter(function (ev) {
    var v = S[ev];
    return !(v instanceof Array) || v.length !== 4 ||
      v.filter(function (x) { return !(x >= 0 && x <= 1); }).length > 0;
  });
  eq(g.title + ': STIM이 4축 0~1 범위다', badVec, []);
  var unknown = Object.keys(S).filter(function (ev) { return !g.chat.T[ev]; });
  eq(g.title + ': STIM 키가 전부 실제 이벤트다', unknown, []);
});

(function () {
  var saveGame = Shell.game, saveComp = Shell.comp, saveFickle = Shell.fickle, savePhase = Shell.phase;
  Shell.game = Shell.games[0]; // 화력쇼 어휘로 검사
  var BASE = [60, 75, 45, 120];
  var reset = function (comp) {
    Shell.comp = comp.slice(); Shell.fickle = [0, 0, 0, 0]; Shell._fickleBorn = 0;
  };
  var delta = function (total, ev) {
    reset(BASE);
    Shell.compAdd(total, ev);
    return Shell.comp.map(function (v, i) { return v - BASE[i]; });
  };
  var top = function (d) { return Shell.ARCH[d.indexOf(Math.max.apply(null, d))].id; };

  // 총량 보존 — 새거나 늘면 시청자 수와 구성 합이 어긋난다 (변이 이후 소수점이 생기므로 오차 허용)
  var bad = [];
  [1, 7, 40, 520, 1401, 33333].forEach(function (total) {
    ['rescue_big', 'disaster', 'done', '__untagged__'].forEach(function (ev) {
      var sum = delta(total, ev).reduce(function (a, b) { return a + b; }, 0);
      if (Math.abs(sum - total) > 1e-6) bad.push(ev + '@' + total + '→' + sum);
    });
  });
  eq('배분 총합이 항상 총량과 같다 (Σ배분 = total)', bad, []);

  // 공명 방향 — 자극 축이 원형을 실제로 갈라야 모델이 의미를 가진다
  eq('rescue_big(숙련 자극) → 분석가에게 최다 배분', top(delta(1000, 'rescue_big')), 'expert');
  eq('disaster(파괴 자극) → 불구경파에게 최다 배분', top(delta(1000, 'disaster')), 'thrill');

  // 변이 — 자극에 이끌린 유입도 이웃 원형에 씨를 뿌린다. 없으면 구성비 0인 원형이 영원히
  // 되살아나지 못하는 흡수 상태가 생긴다 (검증에서 지적된 치명 결함)
  var dd = delta(1000, 'disaster');
  ok('변이: 자극이 약한 원형도 몫을 받는다 (분석가 ' + dd[2].toFixed(1) + ')', dd[2] > 0);
  reset([1000, 0, 0, 0]);
  Shell.compAdd(1000, 'rescue_big');
  ok('구성비 0인 원형도 되살아난다 (흡수 상태 없음)', Shell.comp[1] > 0 && Shell.comp[3] > 0);

  // 호오 — 같은 사건이 원형마다 다른 감정을 부르고, 그것이 유입의 질을 정한다
  reset(BASE);
  Shell.compAdd(1000, 'disaster');
  ok('대참사: 불구경파는 정착한다 (뜨내기 ' + Shell.fickle[0].toFixed(0) + '명)', Shell.fickle[0] === 0);
  ok('대참사: 팬덤은 미워하며 잠깐 본다 (뜨내기 ' + Shell.fickle[1].toFixed(0) + '명)', Shell.fickle[1] > 0);
  ok('대참사: 분석가도 뜨내기로 온다', Shell.fickle[2] > 0);
  var badF = [];
  for (var fi = 0; fi < Shell.ARCH.length; fi++) if (Shell.fickle[fi] > Shell.comp[fi] + 1e-9) badF.push(fi);
  eq('뜨내기는 그 원형 시청자 수를 넘지 않는다 (fickle ≤ comp)', badF, []);

  // 뜨내기 이탈 — 버즈는 오지만 남지 않는다
  var beforeT = Shell.compTotal(), beforeF = Shell.fickleTotal();
  Shell.viewers = beforeT; Shell.phase = 'live';
  for (var s = 0; s < 60; s++) Shell.drainFickle(1);
  ok('뜨내기는 시간이 지나면 빠져나간다 (' + beforeF.toFixed(0) + ' → ' +
     Shell.fickleTotal().toFixed(0) + '명)', Shell.fickleTotal() < beforeF * 0.7);
  ok('정착 관객은 남는다 (총 ' + beforeT.toFixed(0) + ' → ' + Shell.compTotal().toFixed(0) + '명)',
     Shell.compTotal() > beforeT - beforeF - 1);
  Shell.phase = savePhase;

  // 미태깅·중립 유입은 채널의 색을 바꾸지 않는다 (변이도 걸지 않는다)
  reset([100, 100, 100, 100]);
  Shell.compAdd(400, '__untagged__');
  ok('미태깅 이벤트는 구성비를 바꾸지 않는다', Shell.comp.join() === '200,200,200,200');

  // 이탈도 중립 (규약 2 — 손실은 색까지 바꾸지 않는다)
  reset([100, 200, 300, 400]);
  Shell.compSub(500);
  var t = Shell.compTotal();
  ok('이탈은 비례 차감 — 구성비가 유지된다',
     Math.abs(t - 500) < 1e-6 && Math.abs(Shell.comp[3] / t - 0.4) < 1e-6);

  // 다양성 — 탐색 보너스의 입력. 이게 있어야 채널 색을 관리할 이유가 생긴다
  reset([250, 250, 250, 250]);
  ok('완전 균등 구성의 다양성은 1', Math.abs(Shell.diversity() - 1) < 1e-9);
  reset([1000, 0, 0, 0]);
  ok('완전 쏠림 구성의 다양성은 0', Shell.diversity() < 1e-9);

  Shell.game = saveGame; Shell.comp = saveComp; Shell.fickle = saveFickle; Shell.phase = savePhase;
})();

// 게임 명제 유지 — 호오 도입으로 대참사 유입의 일부가 빠져나간다. 이건 의도된 것이지만
// (야유는 트래픽을 부르되 남지 않는다) 순서까지 뒤집히면 critic 4차 승인이 깨진 것이다.
// 화력쇼의 명제: 무사고 완성 ≪ 수습 ≪ 대참사.
(function () {
  var saveGame = Shell.game, saveComp = Shell.comp, saveFickle = Shell.fickle;
  var savePhase = Shell.phase, saveV = Shell.viewers;
  Shell.game = Shell.games[0];
  var net = function (amount, ev, seconds) {
    Shell.comp = [60, 75, 45, 120]; Shell.fickle = [0, 0, 0, 0]; Shell._fickleBorn = 0;
    var before = Shell.compTotal();
    Shell.compAdd(amount, ev);
    Shell.viewers = Shell.compTotal(); Shell.phase = 'live';
    for (var s = 0; s < seconds; s++) Shell.drainFickle(1);
    Shell.phase = savePhase;
    return Shell.compTotal() - before;
  };
  var done = net(40, 'done', 90), rescue = net(900, 'rescue_big', 90), dis = net(1400, 'disaster', 90);
  ok('90초 뒤 실질 유입 순서 유지 — 완성 ' + done.toFixed(0) + ' ≪ 수습 ' + rescue.toFixed(0) +
     ' ≪ 대참사 ' + dis.toFixed(0), done < rescue && rescue < dis);
  ok('수습은 실력 유입이라 거의 그대로 남는다', rescue > 900 * 0.95);
  ok('대참사는 야유 유입분이 빠져나간다 (' + Math.round((1 - dis / 1400) * 100) + '% 이탈)',
     dis < 1400 && dis > 1400 * 0.75);
  Shell.game = saveGame; Shell.comp = saveComp; Shell.fickle = saveFickle;
  Shell.phase = savePhase; Shell.viewers = saveV;
})();

// 캐스팅이 관객 구성을 반영하는가 — "구성이 바뀌면 채팅이 바뀐다"는 이 게임의 코어 주장이라
// 조용히 평탄해지면 공명 모델이 화면에서 사라진다. 확률 검사지만 기대 격차가 30배라 안전하다.
(function () {
  var saveComp = Shell.comp;
  var draw = function (comp) {
    Shell.comp = comp.slice();
    var tally = { thrill: 0, fan: 0, expert: 0, casual: 0 };
    for (var i = 0; i < 2000; i++) tally[Chat.pickPersona({}).arch]++;
    return tally;
  };
  var t1 = draw([100, 100, 800, 100]);
  ok('분석가가 지배하면 그쪽 페르소나가 압도한다 (expert ' + t1.expert + ' vs casual ' + t1.casual + ')',
     t1.expert > t1.casual * 1.8);
  var t2 = draw([800, 100, 100, 100]);
  ok('불구경파가 지배하면 그쪽 페르소나가 압도한다 (thrill ' + t2.thrill + ' vs expert ' + t2.expert + ')',
     t2.thrill > t2.expert * 1.8);
  ok('소수 원형도 완전히 침묵하지는 않는다 (바닥 가중치)', t2.expert > 0);
  Shell.comp = saveComp;
})();

// ---- 채널 계층 — 이월과 구독자 ----
// 이월이 없으면 10번째 방송이 1번째와 똑같아진다. 반대로 이월이 고착되면 초반 선택 실수가
// 회복 불능이 된다 — 둘 다 게임을 망치므로 "물든다 + 되돌릴 수 있다"를 함께 못박는다.
(function () {
  var saveCh = Shell.ch, saveComp = Shell.comp;
  Shell.ch = { subs: 0, shows: 0, fresh: {}, best: {}, log: [], mix: Shell.ARCH_START.slice() };

  eq('구독자 0명 → 시작 보너스 0', Shell.subBonus(), 0);
  Shell.ch.subs = 500;
  eq('구독자 500명 → 시작 관객 +200', Shell.subBonus(), 200);
  Shell.ch.subs = 99999;
  ok('구독자 보너스에 상한이 있다 (언락 페이싱 보호) — ' + Shell.subBonus(), Shell.subBonus() === 700);
  Shell.ch.subs = 0;

  Shell.comp = [900, 50, 25, 25]; // 불구경파가 지배한 방송
  var before = Shell.ch.mix.slice();
  Shell.absorbMix();
  ok('이월 후에도 채널 구성비 합이 1',
     Math.abs(Shell.ch.mix.reduce(function (a, b) { return a + b; }, 0) - 1) < 1e-9);
  ok('불구경파 방송 뒤 채널이 그쪽으로 물든다 (' + before[0].toFixed(2) + ' → ' +
     Shell.ch.mix[0].toFixed(2) + ')', Shell.ch.mix[0] > before[0]);
  ok('한 방송으로 채널 색이 통째로 갈아엎이지는 않는다', Shell.ch.mix[0] < 0.9);
  eq('채널 색 최다는 불구경파', Shell.mixTop().id, 'thrill');

  for (var k = 0; k < 3; k++) { Shell.comp = [25, 25, 900, 50]; Shell.absorbMix(); }
  eq('분석가 방송을 3회 하면 채널 색이 돌아온다 (고착 없음)', Shell.mixTop().id, 'expert');

  Shell.ch = saveCh; Shell.comp = saveComp;
})();

// ---- Giving Up On It: 물리 상수끼리 모순되지 않는가 ----
// 초판 버그: "낙하속도 700 이상"과 "높이 손실 3m 미만"을 동시에 요구해 clutch가 영원히 안 터졌다.
// 값만 봐서는 안 보이고 v²=2gh를 넣어야 드러나는 종류라 여기서 계산으로 잡는다.
var T = Shell.games.filter(function (g) { return g.id === 'giving-up'; })[0].tuning;
var fallPxForClutch = T.CLUTCH_V * T.CLUTCH_V / (2 * T.GRAV);
var fallMForClutch = fallPxForClutch / T.PX_PER_M;
var mapM = (T.GROUND_Y - T.SUMMIT_Y) / T.PX_PER_M;
ok('clutch 속도에 도달하려면 ' + fallMForClutch.toFixed(1) + 'm 낙하 — 맵 높이(' +
   mapM.toFixed(0) + 'm) 안에서 가능하다', fallMForClutch < mapM * 0.5);
ok('그 낙하 후에도 CLUTCH_MIN_H 위에 있을 수 있다 (조건이 서로를 배제하지 않는다)',
   fallMForClutch + T.CLUTCH_MIN_H < mapM);
ok('망치 최소 길이가 몸통 밖이다 (자루가 몸 안으로 말리지 않는다)', T.HAMMER_MIN > 16);
ok('망치 사거리가 최소 길이보다 크다', T.HAMMER_MAX > T.HAMMER_MIN);
eq('추락 신선도표가 규약 4와 같다', T.FALL_FRESH, [1, .7, .45, .25, .1]);

// ---- GUOI 지형: 주 루트가 기하적으로 등반 가능한가 ----
// "발판 위치가 적절하지 않아 못 올라간다"는 피드백의 재발 방지. 연속 발판 사이의
// 수직 간격이 망치 사거리의 3/4 이내, 수평 틈이 사거리 이내인지 계산으로 검사한다.
(function () {
  var bad = [];
  for (var i = 1; i < T.ROUTE.length; i++) {
    var a = T.ROUTE[i - 1], b = T.ROUTE[i];
    var vGap = a.y - b.y; // 위로 갈수록 y가 작다
    var hGap = Math.max(0, Math.max(a.x, b.x) - Math.min(a.x + a.w, b.x + b.w));
    if (vGap <= 0 || vGap > T.HAMMER_MAX * 0.75 || hGap > T.HAMMER_MAX) {
      bad.push(i + ':(v' + vGap + ',h' + hGap + ')');
    }
  }
  eq('주 루트 ' + T.ROUTE.length + '개 발판이 전부 사거리 안에서 이어진다', bad, []);
  // 바위가 주 루트 발판과 겹쳐 길을 막지 않는가
  var blocked = [];
  T.TERRAIN.forEach(function (s) {
    if (s.t !== 'c') return;
    T.ROUTE.forEach(function (r, ri) {
      var cx = Math.max(r.x, Math.min(s.x, r.x + r.w));
      var cy = Math.max(r.y - 40, Math.min(s.y, r.y)); // 발판 상단 40px = 서는 공간
      if (Math.hypot(s.x - cx, s.y - cy) < s.r) blocked.push(ri);
    });
  });
  eq('바위가 주 루트의 발 디딜 공간을 막지 않는다', blocked, []);
})();

// ---- 배포 payload 예산 ----
// 심사 요건 1번이 "링크 클릭만으로 브라우저에서 바로 플레이"다. 지금은 8개 파일 105KB라
// 여유가 크지만, 옆에 12MB짜리 Assets/ 스테이징이 생겼으므로 조용히 무거워질 경로가 열렸다.
// 무거워지는 것 자체가 아니라 "모르는 사이에" 무거워지는 걸 막는다.
var SHIPPED = [
  '../../index.html', 'shell.css', 'config.js', 'chat.js', 'llm.js', 'shell.js',
  '../hwaryeok/chat-data.js', '../hwaryeok/game.js',
  '../giving-up/chat-data.js', '../giving-up/game.js',
  '../pocket/chat-data.js', '../pocket/game.js',
];
// 스트리머 캠 얼굴 (자작 확인 — Assets/*/SOURCES.md)
var FACES = ['silence', 'surprise', 'panic', 'aha', 'confusion', 'thinking', 'question']
  .map(function (m) { return 'faces/adventurer_' + m + '.png'; });
var BUDGET_KB = 450; // 코드 ~140KB + 얼굴 ~100KB + 여유. "링크 클릭 즉시 플레이" 가드
Promise.all([
  Promise.all(SHIPPED.map(function (u) {
    return fetch(u, { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : null; }).catch(function () { return null; });
  })),
  Promise.all(FACES.map(function (u) {
    return fetch(u, { cache: 'no-store' }).then(function (r) { return r.ok ? r.arrayBuffer() : null; }).catch(function () { return null; });
  })),
]).then(function (rs) {
  var texts = rs[0], imgs = rs[1];
  var missing = SHIPPED.filter(function (_, i) { return texts[i] === null; })
    .concat(FACES.filter(function (_, i) { return imgs[i] === null; }));
  eq('배포 파일이 전부 존재한다 (코드 ' + SHIPPED.length + ' + 얼굴 ' + FACES.length + ')', missing, []);
  var kb = texts.reduce(function (a, t) { return a + (t ? new Blob([t]).size : 0); }, 0) / 1024
         + imgs.reduce(function (a, b) { return a + (b ? b.byteLength : 0); }, 0) / 1024;
  ok('배포 payload ' + kb.toFixed(0) + 'KB — 예산 ' + BUDGET_KB + 'KB 이내', kb < BUDGET_KB);
  // Assets/는 라이선스 미확인 스테이징이라 배포물이 참조하면 안 된다 (Assets/README.md)
  var leaks = SHIPPED.filter(function (_, i) { return texts[i] && /["'(\s]Assets\//.test(texts[i]); });
  eq('배포물이 Assets/ 스테이징을 참조하지 않는다', leaks, []);
  finish();
});

function finish() {
  document.getElementById('out').textContent =
    log.join('\n') + '\n\n' + (fail ? 'FAIL ' + fail + ' / ' : '') + 'PASS ' + pass;
  document.getElementById('out').className = fail ? 'ng' : 'ok';
  console.log(fail ? 'SELFTEST FAIL ' + fail : 'SELFTEST PASS ' + pass);
}
</script>
</body>
</html>
