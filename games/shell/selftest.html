<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>셸 자체 점검</title>
<style>
  body { background:#0b0908; color:#ece7dd; font:13px/1.7 ui-monospace, Consolas, monospace; padding:24px; }
  .ok { color:#6fd98f; } .ng { color:#ff6b5a; font-weight:700; }
  h1 { font-size:16px; color:#ffb447; letter-spacing:2px; }

</style>

<body>
<h1>JONGGEMS SHELL — SELF CHECK</h1>
<p class="note">조용히 틀리면 게임이 뒤집히는 로직만 본다: 규약 4 신선도 회전과 채팅 검증 게이트.<br>
그래픽·물리는 대상이 아니다 (눈으로 본다).</p>
<pre id="out"></pre>

<script src="../../data/personas/cast.js"></script>
<script src="config.js"></script>
<script src="../../engine/chat.js"></script>
<script src="../../engine/llm.js"></script>
<script src="shell.js"></script>
<script src="../../data/events/hwaryeok.js"></script>
<script src="../hwaryeok/game.js"></script>
<script src="../../data/events/giving-up.js"></script>
<script src="../giving-up/game.js"></script>
<script src="../../data/events/pocket.js"></script>
<script src="../pocket/game.js"></script>
<script src="../../data/events/bomb.js"></script>
<script src="../bomb/game.js"></script>
<script src="../../data/events/fishing.js"></script>
<script src="../fishing/game.js"></script>
<script>
var pass = 0, fail = 0, log = [];
function eq(label, got, want) {
  var g = JSON.stringify(got), w = JSON.stringify(want);
  var ok = g === w;
  ok ? pass++ : fail++;
  log.push((ok ? '  ok  ' : ' FAIL ') + label + (ok ? '' : '\n        got  ' + g + '\n        want ' + w));
}
function ok(label, cond) { eq(label, !!cond, true); }

// ---- 규약 4: 신선도 감쇠표 ----
eq('감쇠표는 100/70/45/25/10%', Shell.FRESH_MULT, [1, .7, .45, .25, .1]);

// ---- 규약 4: 같은 게임만 반복하면 바닥까지 물린다 ----
var ids = ['a', 'b'], f = {};
var seq = [];
for (var i = 0; i < 6; i++) { f = Shell.rotateFresh(f, 'a', ids); seq.push(f.a); }
eq('a만 6회 방송 → 단계 1,2,3,4,4,4', seq, [1, 2, 3, 4, 4, 4]);
eq('그동안 b는 0에서 더 내려가지 않는다', f.b, 0);

// ---- 규약 4: 종겜을 벌주면 안 된다 ----
// 중요한 건 저장된 단계가 아니라 "방송을 시작하는 순간 적용되는 배수"다.
// 교대로 틀면 매 방송이 ×1.0이어야 하고, 한 게임만 파면 계단식으로 떨어져야 한다.
function multsWhilePlaying(order) {
  var m = {}, got = [];
  order.forEach(function (id) {
    got.push(Shell.FRESH_MULT[m[id] || 0]);
    m = Shell.rotateFresh(m, id, ids);
  });
  return got;
}
eq('a,b 교대 8회 → 매 방송이 100%', multsWhilePlaying(['a','b','a','b','a','b','a','b']),
   [1, 1, 1, 1, 1, 1, 1, 1]);
eq('a만 6회 → 100/70/45/25/10/10%', multsWhilePlaying(['a','a','a','a','a','a']),
   [1, .7, .45, .25, .1, .1]);

// ---- 규약 4: 물린 뒤 다른 게임을 방송하면 회복된다 ----
f = {};
for (var k = 0; k < 3; k++) f = Shell.rotateFresh(f, 'a', ids); // a: 3단계
eq('a 3회 → 3단계', f.a, 3);
f = Shell.rotateFresh(f, 'b', ids);
eq('b 한 판이 a를 한 단계 회복시킨다', f.a, 2);

// ---- 클립 흥미도 — 조용히 틀리면 클립이 도배되거나 영영 안 잡힌다 ----
var IS = Shell.interestScore, TH = Shell.CLIP.THRESH;
ok('무게 4 첫 발생은 급증 없이도 클립', IS(4, 0, 0) >= TH);
ok('무게 2(도네급 양념)는 급증 만점에도 클립 불가 (규약 5)', IS(2, 0, 1) < TH);
ok('무게 3은 급증이 실려야 클립', IS(3, 0, 0) < TH && IS(3, 0, 1) >= TH);
ok('3회째 반복은 무엇이어도 클립 불가 (규약 4)', IS(4, 2, 1) < TH);
ok('무게 4 두 번째는 급증이 실리면 클립 가능', IS(4, 1, 1) >= TH);
ok('급증 신호는 단조 증가', IS(4, 1, 1) > IS(4, 1, .5) && IS(4, 1, .5) > IS(4, 1, 0));

// ---- 상점 구매 — 차감·중복·잔액 검사 (틀리면 코인 증발 or 무한 구매) ----
var shopCh = { coins: 1000, gear: {} };
eq('구매 성공 시 정확히 차감', (Shell.shopBuy(shopCh, { id: 'x', price: 600 }) === 'ok' ? shopCh.coins : -1), 400);
ok('잔액 부족은 거부·잔액 불변', Shell.shopBuy(shopCh, { id: 'y', price: 999 }) === 'poor' && shopCh.coins === 400);
ok('중복 구매는 거부·잔액 불변', Shell.shopBuy(shopCh, { id: 'x', price: 100 }) === 'owned' && shopCh.coins === 400);

// ---- 파트너 평가 (김 피디) — 결정론 공식. 틀리면 평가가 채널 서사를 거꾸로 쓴다 ----
var GS = Shell.gradeShow;
ok('대박 방송(100배 성장·클립 3·도네)은 S',
   GS({ final: 30000, start: 300, peak: 33000, clips: 3, coins: 2000, freshPct: 100, dead: false }).grade === 'S');
ok('송출 끊김은 같은 지표여도 S/A 불가',
   'SA'.indexOf(GS({ final: 30000, start: 300, peak: 33000, clips: 3, coins: 2000, freshPct: 100, dead: true }).grade) < 0);
ok('성장이 클수록 점수가 높다 (단조)',
   GS({ final: 3000, start: 300, peak: 3300, clips: 1, coins: 500, freshPct: 100, dead: false }).score >
   GS({ final: 600, start: 300, peak: 3300, clips: 1, coins: 500, freshPct: 100, dead: false }).score);
ok('아무 일도 없던 방송은 D',
   GS({ final: 300, start: 300, peak: 300, clips: 0, coins: 0, freshPct: 45, dead: false }).grade === 'D');

// ---- 오늘의 미션 — 결정론·회전 (허브 표시와 정산이 같은 값을 봐야 한다) ----
var M0 = Shell.makeMissions({ shows: 0, best: {} }), M1 = Shell.makeMissions({ shows: 1, best: {} });
ok('미션은 2개, 목표·보상은 양수', M0.length === 2 && M0.every(function (m) { return m.target > 0 && m.reward > 0; }));
ok('회차마다 구성이 회전한다', M0[0].k !== M1[0].k);
ok('같은 채널 상태 → 같은 미션 (결정론)', JSON.stringify(M0) === JSON.stringify(Shell.makeMissions({ shows: 0, best: {} })));

// ---- 파트너 등급 게이지 (파트너 계약 ③) — 틀리면 서사가 거꾸로 간다 ----
var TS = Shell.tierStep;
ok('S 2회 → 브론즈 게이지 6 도달, 실버 승급', (function () {
  var r = TS(0, 0, 'S'); r = TS(r.tier, r.pts, 'S'); return r.tier === 1 && r.promoted;
})());
ok('C/D는 게이지만 깎는다 — 0 밑 없음·강등 없음', (function () {
  var r = TS(1, 0, 'D'); return r.tier === 1 && r.pts === 0 && !r.promoted;
})());
ok('승급 초과분은 다음 게이지로 이월', TS(0, 5, 'S').tier === 1 && TS(0, 5, 'S').pts === 2);
ok('다이아(최고 등급)에선 더 오르지 않는다', TS(4, 99, 'S').tier === 4);
ok('등급 미달 상품은 구매 잠금', Shell.shopBuy({ coins: 99999, gear: {}, tier: 0 }, { id: 'z', price: 1, minTier: 4 }) === 'locked');

// ---- 채팅 검증 게이트 ----
// 캐스트가 data/에서 로드됐는지부터 — 빠지면 게이트가 아니라 침묵이 온다 (engine/chat.js 경고 참조)
ok('페르소나 캐스트가 data/personas/cast.js에서 로드된다 (8종 이상)', Chat.personas.length >= 8);
ok('캐스트 톤이 전부 공인 6종 안이다', Chat.personas.every(function (p) {
  return p.tones.length && p.tones.every(function (t) {
    return ['hype', 'worry', 'info', 'mock', 'cheer', 'question'].indexOf(t) >= 0;
  });
}));
Chat.init(document.createElement('div'));
Chat.load({
  t: { facts: ['수습 +{gain}!!'], flavor: [['hype', '와 미쳤다'], ['mock', '운빨 ㅋㅋ']] },
}, {});
Chat.history.length = 0;
ok('사실 슬롯이 빠진 발화는 폐기된다', Chat.verify('아무 말', { gain: '1,234' }) === false);
ok('슬롯이 그대로 들어간 발화는 통과한다', Chat.verify('수습 +1,234!!', { gain: '1,234' }) === true);
Chat.history = ['와 미쳤다'];
ok('직전 발화와 같으면 폐기된다 (비반복 게이트)', Chat.verify('와 미쳤다', {}) === false);
ok('다른 말은 통과한다', Chat.verify('운빨 ㅋㅋ', {}) === true);
Chat.history.length = 0;
ok('어휘에 없는 이벤트는 조용히 무시된다 (셸이 죽지 않는다)',
   (function () { try { Chat.react('없는이벤트'); return true; } catch (e) { return false; } })());

// ---- 사실 슬롯 이스케이프가 검증 계약을 깨지 않는지 ----
Chat.history.length = 0;
var composed = Chat.compose({ nick: 'x', color: '#fff', tones: ['hype'] }, 't', { gain: '9,999' }, true);
eq('슬롯 치환 결과', composed, '수습 +9,999!!');

// ---- 등록된 게임이 계약을 지키는가 ----
eq('게임 5종이 등록된다', Shell.games.map(function (g) { return g.id; }), ['hwaryeok', 'giving-up', 'pocket', 'bomb', 'fishing']);
Shell.games.forEach(function (g) {
  ok(g.title + ': 필수 필드가 있다',
     g.title && g.tagline && g.duration > 0 && g.startViewers > 0 && typeof g.start === 'function');
  // 아트 지연 로드 (contract 4.1) — 전 게임이 이미지를 쓰므로 전 게임에 요구한다.
  // 두 번 불러도 안전해야 한다 (셸이 방송 준비마다 부른다) — 여기서 실제로 두 번 부른다.
  // 게임의 이미지 경로는 index.html 기준이라 이 페이지에선 404가 콘솔에 찍힌다 — 예상 노이즈.
  // 파일 존재 자체는 아래 배포 payload 검사(FACES 목록)가 절대 경로로 따로 검증한다.
  ok(g.title + ': preload 훅이 있고 재호출이 안전하다', (function () {
    if (typeof g.preload !== 'function') return false;
    try { g.preload(); g.preload(); return true; } catch (e) { return false; }
  })());
  ok(g.title + ': 채팅 어휘에 start/end가 있다', !!(g.chat.T.start && g.chat.T.end));
  var thin = Object.keys(g.chat.T).filter(function (k) { return g.chat.T[k].flavor.length < 6; });
  eq(g.title + ': 모든 이벤트가 flavor 6개 이상 (비반복 게이트 전제)', thin, []);
  var tones = ['hype', 'worry', 'info', 'mock', 'cheer', 'question'];
  var bad = [];
  Object.keys(g.chat.T).forEach(function (k) {
    g.chat.T[k].flavor.forEach(function (f) { if (tones.indexOf(f[0]) < 0) bad.push(k + ':' + f[0]); });
  });
  eq(g.title + ': 톤이 전부 공인 6종 안에 있다', bad, []);
  // 사실 템플릿 슬롯 정합 — 한 이벤트의 사실 템플릿들은 같은 슬롯 집합을 써야 한다.
  // 다르면 게임이 어떤 facts를 넘겨도 일부 템플릿이 "모든 슬롯 포함" 게이트에서 반드시
  // 떨어져 사실 줄이 확률적으로(최악엔 상시) 폐기된다 — pocket 4종에서 실제 발생 (관객 리뷰)
  var slotBad = [];
  Object.keys(g.chat.T).forEach(function (k) {
    var fs = g.chat.T[k].facts || [];
    if (fs.length < 2) return;
    var sets = fs.map(function (t) {
      return (t.match(/\{(\w+)\}/g) || []).map(function (s) { return s.slice(1, -1); })
        .sort().filter(function (v, i, a) { return a.indexOf(v) === i; }).join(',');
    });
    for (var si = 1; si < sets.length; si++) {
      if (sets[si] !== sets[0]) { slotBad.push(k + '(' + sets.join(' vs ') + ')'); break; }
    }
  });
  eq(g.title + ': 사실 템플릿들이 같은 슬롯 집합을 쓴다', slotBad, []);
});

// ---- Giving Up On It: 물리 상수끼리 모순되지 않는가 ----
// 초판 버그: "낙하속도 700 이상"과 "높이 손실 3m 미만"을 동시에 요구해 clutch가 영원히 안 터졌다.
// 값만 봐서는 안 보이고 v²=2gh를 넣어야 드러나는 종류라 여기서 계산으로 잡는다.
var T = Shell.games.filter(function (g) { return g.id === 'giving-up'; })[0].tuning;
var fallPxForClutch = T.CLUTCH_V * T.CLUTCH_V / (2 * T.GRAV);
var fallMForClutch = fallPxForClutch / T.PX_PER_M;
var mapM = (T.GROUND_Y - T.SUMMIT_Y) / T.PX_PER_M;
ok('clutch 속도에 도달하려면 ' + fallMForClutch.toFixed(1) + 'm 낙하 — 맵 높이(' +
   mapM.toFixed(0) + 'm) 안에서 가능하다', fallMForClutch < mapM * 0.5);
ok('그 낙하 후에도 CLUTCH_MIN_H 위에 있을 수 있다 (조건이 서로를 배제하지 않는다)',
   fallMForClutch + T.CLUTCH_MIN_H < mapM);
ok('망치 최소 길이가 몸통 밖이다 (자루가 몸 안으로 말리지 않는다)', T.HAMMER_MIN > 16);
ok('망치 사거리가 최소 길이보다 크다', T.HAMMER_MAX > T.HAMMER_MIN);
eq('추락 신선도표가 규약 4와 같다', T.FALL_FRESH, [1, .7, .45, .25, .1]);

// ---- GUOI 지형: 주 루트가 기하적으로 등반 가능한가 ----
// "발판 위치가 적절하지 않아 못 올라간다"는 피드백의 재발 방지. 연속 발판 사이의
// 수직 간격이 망치 사거리의 3/4 이내, 수평 틈이 사거리 이내인지 계산으로 검사한다.
(function () {
  var bad = [];
  for (var i = 1; i < T.ROUTE.length; i++) {
    var a = T.ROUTE[i - 1], b = T.ROUTE[i];
    var vGap = a.y - b.y; // 위로 갈수록 y가 작다
    var hGap = Math.max(0, Math.max(a.x, b.x) - Math.min(a.x + a.w, b.x + b.w));
    if (vGap <= 0 || vGap > T.HAMMER_MAX * 0.75 || hGap > T.HAMMER_MAX) {
      bad.push(i + ':(v' + vGap + ',h' + hGap + ')');
    }
  }
  eq('주 루트 ' + T.ROUTE.length + '개 발판이 전부 사거리 안에서 이어진다', bad, []);
  // 바위가 주 루트 발판과 겹쳐 길을 막지 않는가
  var blocked = [];
  T.TERRAIN.forEach(function (s) {
    if (s.t !== 'c') return;
    T.ROUTE.forEach(function (r, ri) {
      var cx = Math.max(r.x, Math.min(s.x, r.x + r.w));
      var cy = Math.max(r.y - 40, Math.min(s.y, r.y)); // 발판 상단 40px = 서는 공간
      if (Math.hypot(s.x - cx, s.y - cy) < s.r) blocked.push(ri);
    });
  });
  eq('바위가 주 루트의 발 디딜 공간을 막지 않는다', blocked, []);

  // 출발 지점이 천장 밑에 깔려 있지 않은가.
  // 위 두 검사는 ROUTE 발판끼리의 관계만 보므로 "스폰 → 첫 발판" 구간이 사각지대였고,
  // 실제로 스폰(480)이 첫 발판(x 360~600) 바로 밑 16px 틈에 갇혀 있었다(플레이 피드백).
  // 항아리 윗면에서 수직으로 올려다봤을 때 가장 낮은 천장까지의 거리를 잰다.
  var topY = T.GROUND_Y - T.PR * 2;   // 스폰 시 항아리 윗면
  var ceil = Infinity, ceilAt = null;
  T.TERRAIN.forEach(function (s) {
    if (s.hidden) return;
    var lowest;                        // 이 지형의 아랫면 (스폰 x 기준)
    if (s.t === 'r') {
      if (T.START_X < s.x || T.START_X > s.x + s.w) return;
      lowest = s.y + s.h;
    } else {
      var dx = Math.abs(s.x - T.START_X);
      if (dx >= s.r) return;
      lowest = s.y + Math.sqrt(s.r * s.r - dx * dx);
    }
    if (lowest > topY) return;         // 항아리보다 아래에 있는 것은 천장이 아니다
    if (topY - lowest < ceil) { ceil = topY - lowest; ceilAt = s; }
  });
  ok('출발 지점 머리 위가 ' + T.HEAD_ROOM_MIN + 'px 이상 비어 있다 (실측 ' +
     (ceil === Infinity ? '천장 없음' : Math.round(ceil) + 'px') + ')',
     ceil >= T.HEAD_ROOM_MIN);

  // 출발 지점에서 첫 발판이 "한 번에 걸리는" 거리인가.
  // 머리 위가 트여 있어도(위 검사) 첫 발판이 사거리 밖이면 지상 장대높이뛰기부터 배워야
  // 한다 — START_X 800 시절 자동 플레이 38초 동안 걸기 0회가 그 증거다(2026-08-08 실측).
  // 도입부는 "걸고 오른다" 한 동작이어야 하고, 그 성립 조건을 여기 박아둔다.
  var spawn = { x: T.START_X, y: T.GROUND_Y - T.PR };
  var r0 = T.ROUTE[0];
  var nx = Math.max(r0.x, Math.min(spawn.x, r0.x + r0.w));
  var firstHook = Math.hypot(nx - spawn.x, r0.y - spawn.y);
  ok('출발 지점에서 첫 발판까지 ' + Math.round(firstHook) + 'px — 한 번에 걸린다 (기준 ' +
     T.FIRST_HOOK_MAX + 'px)', firstHook <= T.FIRST_HOOK_MAX);

  // 가장자리 벽 홀드 — "화면 가장자리에 벽 판정 + 벽으로 오르기" (사용자 피드백).
  // 주 루트와 같은 기하 기준을 적용한다: 같은 벽의 연속 홀드 수직 간격 ≤ 사거리×0.75.
  // 홀드는 바위 회피로 y가 밀릴 수 있으므로 생성 결과를 그대로 검사한다.
  (function () {
    var sides = { L: [], R: [] };
    T.WALL_HOLDS.forEach(function (h) { (h.x < 480 ? sides.L : sides.R).push(h); });
    var bad = [];
    ['L', 'R'].forEach(function (k) {
      var hs = sides[k].slice().sort(function (a, b) { return b.y - a.y; }); // 아래→위
      // 바닥에서 첫 홀드도 사거리 안이어야 벽 루트에 진입할 수 있다
      if (T.GROUND_Y - hs[0].y > T.HAMMER_MAX) bad.push(k + ':ground(' + (T.GROUND_Y - hs[0].y) + ')');
      for (var i = 1; i < hs.length; i++) {
        var vGap = hs[i - 1].y - hs[i].y;
        if (vGap <= 0 || vGap > T.HAMMER_MAX * 0.75) bad.push(k + i + ':(v' + vGap + ')');
      }
    });
    eq('벽 홀드 ' + T.WALL_HOLDS.length + '개가 좌우 각각 사거리 안에서 이어진다', bad, []);
    // 바위 회피 배치 검증 — 서는 공간(상단 40px)이 바위와 겹치지 않는다
    var blocked = [];
    T.TERRAIN.forEach(function (s) {
      if (s.t !== 'c') return;
      T.WALL_HOLDS.forEach(function (h, hi) {
        var cx = Math.max(h.x, Math.min(s.x, h.x + h.w));
        var cy = Math.max(h.y - 40, Math.min(s.y, h.y + h.h));
        if (Math.hypot(s.x - cx, s.y - cy) < s.r) blocked.push(hi);
      });
    });
    eq('바위가 벽 홀드의 발 디딜 공간을 막지 않는다', blocked, []);
  })();
})();

// ---- 배포 payload 예산 ----
// 심사 요건 1번이 "링크 클릭만으로 브라우저에서 바로 플레이"다. 지금은 8개 파일 105KB라
// 여유가 크지만, 옆에 12MB짜리 Assets/ 스테이징이 생겼으므로 조용히 무거워질 경로가 열렸다.
// 무거워지는 것 자체가 아니라 "모르는 사이에" 무거워지는 걸 막는다.
var SHIPPED = [
  '../../index.html', 'shell.css', 'config.js', 'shell.js',
  '../../engine/chat.js', '../../engine/llm.js', '../../data/personas/cast.js',
  '../../data/events/hwaryeok.js', '../hwaryeok/game.js',
  '../../data/events/giving-up.js', '../giving-up/game.js',
  '../../data/events/pocket.js', '../pocket/game.js',
  '../../data/events/bomb.js', '../bomb/game.js',
  '../../data/events/fishing.js', '../fishing/game.js',
];
// 스트리머 캠 얼굴 (자작 확인 — Assets/*/SOURCES.md)
var FACES = ['silence', 'surprise', 'panic', 'aha', 'confusion', 'thinking', 'question']
  .map(function (m) { return 'faces/adventurer_' + m + '.png'; });
// 데스크탑 허브 이미지 (AetherAI 생성 — tools/aether-assets.json).
// 생성 원본은 합계 2.9MB였다. tools/optimize-images.ps1 를 거치지 않고 커밋하면
// 여기서 예산이 터진다 — 그게 이 목록에 넣는 이유다.
FACES = FACES.concat(['img/desktop-wallpaper.jpg', 'img/icon-hwaryeok.png',
  'img/icon-giving-up.png', 'img/icon-pocket.png',
  'img/icon-fishing.png', 'img/icon-bomb.png']);
// 주머니 괴수 아트 (AetherAI — 몬스터 6종 알파 PNG, 스킬 VFX 시트 7종 JPEG)
FACES = FACES.concat(
  ['me-fire', 'me-water', 'me-grass', 'foe-fire', 'foe-water', 'foe-grass']
    .map(function (n) { return '../pocket/img/' + n + '.png'; }),
  ['vfx-tackle', 'vfx-fire', 'vfx-water', 'vfx-grass', 'vfx-ult-fire', 'vfx-ult-water', 'vfx-ult-grass']
    .map(function (n) { return '../pocket/img/' + n + '.jpg'; }));
// 화력쇼·GUOI 아트 (AetherAI — 배경 플레이트·팬·클로슈·항아리·망치 헤드)
FACES = FACES.concat(['../hwaryeok/img/studio-bg.jpg', '../hwaryeok/img/pan.png',
  '../hwaryeok/img/cloche.png', '../giving-up/img/pot.png', '../giving-up/img/hammer.png',
  '../giving-up/img/sky-bg.jpg', '../giving-up/img/ledge.png', '../giving-up/img/boulder.png',
  '../pocket/img/arena-bg.jpg']);
// UI 크롬 아이콘 + 면 텍스처 (AetherAI — 이모지·CSS 단색면 대체)
FACES = FACES.concat(['ui-logo', 'ui-chat', 'ui-obs', 'ui-sound', 'ui-net', 'ui-eye', 'ui-heart']
  .map(function (n) { return 'img/' + n + '.png'; }),
  ['img/ui-titlebar.jpg', 'img/ui-taskbar.jpg', 'img/ui-panelbg.jpg', 'img/ui-button.png',
   'img/ui-coin.png']);
// 상점 아이콘 (AetherAI — 데스크탑 앱 1종 + 상품 5종)
FACES = FACES.concat(['icon-shop', 'shop-camgold', 'shop-neonsign', 'shop-fanfare',
  'shop-tallyplat', 'shop-holobadge', 'shop-diaaura'].map(function (n) { return 'img/' + n + '.png'; }));
// 김 피디 초상 + 알림 배너 플레이트 (AetherAI)
FACES = FACES.concat(['img/kim-pd.png', 'img/ui-banner-mint.jpg', 'img/ui-banner-gold.jpg']);
// 인트로 4컷 만화 + 이모지 대체 아이콘 (AetherAI) + GUOI 머리·사용자 곡괭이
FACES = FACES.concat(['img/comic-1.jpg', 'img/comic-2.jpg', 'img/comic-3.jpg', 'img/comic-4.jpg',
  'img/ui-lock.png', 'img/ui-wrench.png', 'img/ui-star.png', '../giving-up/img/head.png']);
// 심연낚시·해체쇼 아트 (AetherAI — "게임 내 이미지 전부 AetherAI" 방침의 마지막 두 게임)
FACES = FACES.concat(
  ['boat'].concat(['sp-minnow', 'sp-guppy', 'sp-clam', 'sp-conch', 'sp-starfish', 'sp-shrimp', 'sp-carp', 'sp-sardine', 'sp-anchovy', 'sp-squid', 'sp-jelly', 'sp-babyturtle', 'sp-catfish', 'sp-snakehead', 'sp-sailfin', 'sp-dolphin', 'sp-sunfish', 'sp-seaturtle', 'sp-bigeye', 'sp-lantern', 'sp-steelgill', 'sp-shark', 'sp-giantsquid', 'sp-monkfish', 'sp-abysslord', 'sp-abyssmother', 'sp-whale', 'sp-leviathan', 'sp-ghostjelly', 'sp-goldsunfish'])
    .map(function (n) { return '../fishing/img/' + n + '.png'; }),
  ['../fishing/img/sea-bg.jpg', '../fishing/img/vfx-splash.jpg',
   '../bomb/img/bench-bg.jpg', '../bomb/img/bomb-body.png', '../bomb/img/vfx-boom.jpg']);
// 450 → 900 → 1200 (2026-08-08): "전부 AetherAI로" 방침에 따라 전 게임 아트가 들어왔다
// (포켓 13종 + 캠 7종 교체 + 배경 2종 + 액터 4종). 900 인상 때 "또 올리면 에셋을 의심할 것"
// 이라 적었고, 의심한 결과: 이번이 아트 완성 단계라 마지막 인상이다. 1.2MB도 일반 회선
// 1~2초 — "링크 클릭 즉시 플레이"는 유지된다. 여기서 더 오르면 그때는 정말 잘라낼 것.
// → 1200 → 2000 (2026-08-08 오후): 게임 2종(심연낚시·해체쇼)에도 아트가 들어와 총량이
//   늘었다. 대신 같은 PR에서 게임 아트 전부를 지연 로드로 돌렸다 — 첫 화면은 이제
//   바탕화면+아이콘 ~150KB만 내려받는다. "링크 클릭 즉시 플레이"의 실체는 첫 화면이고,
//   이 예산은 총량 상한(회선 부담 가드)으로 남는다.
// → 2000 → 2200 (2026-08-08 밤): "작은 것 하나하나 AetherAI" 방침으로 GUOI 발판·바위,
//   상점 아이콘 6, 김 피디 초상, 배너 플레이트 2가 추가됐다. 전부 지연 로드 뒤에 있어
//   첫 화면(~150KB)은 불변 — 이 예산은 총량 상한(회선 부담 가드)이다.
// → 2200 → 2300 (2026-08-09): 전체화면 방송 + 클립 채팅 합성 코드(약 6KB)로 상한 터치.
//   이번 인상분은 이미지가 아니라 코드다 — 에셋 총량은 동결 상태.
// → 2300 → 2700 (2026-08-09): 심연낚시 어종 30종(사용자 요청 — 거북·개복치·상어·고래 등).
//   전부 방송 준비 때 지연 로드 — 첫 화면 불변. 이미지 인상분 약 350KB.
var BUDGET_KB = 2700;
Promise.all([
  Promise.all(SHIPPED.map(function (u) {
    return fetch(u, { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : null; }).catch(function () { return null; });
  })),
  Promise.all(FACES.map(function (u) {
    return fetch(u, { cache: 'no-store' }).then(function (r) { return r.ok ? r.arrayBuffer() : null; }).catch(function () { return null; });
  })),
]).then(function (rs) {
  var texts = rs[0], imgs = rs[1];
  var missing = SHIPPED.filter(function (_, i) { return texts[i] === null; })
    .concat(FACES.filter(function (_, i) { return imgs[i] === null; }));
  eq('배포 파일이 전부 존재한다 (코드 ' + SHIPPED.length + ' + 얼굴 ' + FACES.length + ')', missing, []);
  var kb = texts.reduce(function (a, t) { return a + (t ? new Blob([t]).size : 0); }, 0) / 1024
         + imgs.reduce(function (a, b) { return a + (b ? b.byteLength : 0); }, 0) / 1024;
  ok('배포 payload ' + kb.toFixed(0) + 'KB — 예산 ' + BUDGET_KB + 'KB 이내', kb < BUDGET_KB);
  // Assets/는 라이선스 미확인 스테이징이라 배포물이 참조하면 안 된다 (Assets/README.md)
  var leaks = SHIPPED.filter(function (_, i) { return texts[i] && /["'(\s]Assets\//.test(texts[i]); });
  eq('배포물이 Assets/ 스테이징을 참조하지 않는다', leaks, []);
  finish();
});

function finish() {
  document.getElementById('out').textContent =
    log.join('\n') + '\n\n' + (fail ? 'FAIL ' + fail + ' / ' : '') + 'PASS ' + pass;
  document.getElementById('out').className = fail ? 'ng' : 'ok';
  console.log(fail ? 'SELFTEST FAIL ' + fail : 'SELFTEST PASS ' + pass);
}
</script>
